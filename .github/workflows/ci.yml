name: Battery SOH CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Source Files
        run: |
          python -m py_compile src/data.py
          python -m py_compile src/features.py
          python -m py_compile src/models.py
          python -m py_compile src/evaluate.py
          python -m py_compile scripts/train.py
          python -m py_compile scripts/load_data.py
          python -m py_compile scripts/ablation.py

      - name: Test Core Imports
        run: |
          python -c "import numpy, pandas, sklearn"